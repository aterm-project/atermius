<!DOCTYPE html><html><head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http: https: ws: wss:; worker-src 'self' blob:; manifest-src 'self'">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Atermius self-hosted encrypted SSH workspace">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta id="atermius-theme-color" name="theme-color" content="#0c0e11">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="favicon.ico?v=65a0c1a5">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <title>Atermius</title>
  <style>
    :root {
      color-scheme: dark;
      --app-background: #0c0e11;
      --app-text: #eef2f6;
      --app-progress: #90c2ff;
      --app-warning: #ffb55e;
    }
    html, body { margin: 0; background: var(--app-background); height: 100%; overflow: hidden; }
    /* `hidden` still lets the browser scroll the page to reveal something
       (find-in-page, a screen reader or an extension reaching an
       accessibility node past the edge), which left the whole app shifted
       sideways with no way to scroll back. `clip` cannot be scrolled at all.
       The engine sets `overflow: hidden` inline on <body>, hence !important. */
    html, body { overflow: clip !important; }
    /* Silent-loading splash: the animated startup state lives here until the
       splash controller (splash-loader.js) releases it. */
    #atermius-splash {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: var(--app-background);
      color: var(--app-text);
      font: 15px system-ui, sans-serif;
      letter-spacing: .2px;
      display: grid;
      place-items: center;
    }
    #atermius-wordmark span {
      display: inline-block;
      will-change: transform, opacity;
    }
    .atermius-wordmark-pulse { animation: atermius-breathe 1.8s ease-in-out infinite; }
    @keyframes atermius-breathe {
      0%, 100% { opacity: 1; }
      50% { opacity: .45; }
    }
    .atermius-splash-hide { opacity: 0; transition: opacity .45s ease, transform .45s ease; }
    /* Thin background-preload bar; never intercepts input on the login page. */
    #atermius-progress {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      z-index: 21;
      pointer-events: none;
      opacity: 0;
      transition: opacity .3s ease;
    }
    #atermius-progress.is-active { opacity: .9; }
    #atermius-progress.is-done { opacity: 0; transition: opacity .6s ease .25s; }
    #atermius-progress-fill {
      height: 100%;
      width: 0%;
      background: var(--app-progress);
      transition: width .3s ease;
    }
    #atermius-progress.is-failed #atermius-progress-fill { background: var(--app-warning); }
  </style>
<script src="share-bootstrap.js"></script>
<script src="startup-theme.js"></script>
<script src="gsap/gsap.min.js"></script>
<script type="text/javascript" src="sodium.js" async="true"></script></head>
<body>
  <div id="atermius-progress"><div id="atermius-progress-fill"></div></div>
  <div id="atermius-splash"><span id="atermius-wordmark">Starting Atermius…</span></div>
  <script src="splash-loader.js"></script>
  <script src="flutter_bootstrap.js" async=""></script>


</body></html>
