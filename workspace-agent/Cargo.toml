[package]
name = "atermius-agent"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Outbound authenticated workspace nodes for Atermius Server"

[dependencies]
anyhow = "1"
hex = "0.4"
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost = "0.14"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
tonic-prost-build = "0.14"
